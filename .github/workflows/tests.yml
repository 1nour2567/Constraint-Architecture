name: tests

on:
  push:
  pull_request:

jobs:
  structural:
    name: structural tests (no LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pytest
        run: pip install pytest

      - name: Run tests (33)
        run: pytest tests -q

      - name: Run package self-checks (25)
        run: python -m constraint_architecture.skeleton
